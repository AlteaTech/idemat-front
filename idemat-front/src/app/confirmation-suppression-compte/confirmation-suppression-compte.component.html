<div class="dialog-container">

  <div class="dialog-header">
    <h2 class="dialog-title">Supprimer mon compte</h2>
  </div>

  <p>Cette action est <strong>irréversible</strong>. Votre compte et toutes vos données seront définitivement supprimés.</p>
  <p class="question-continuer">Souhaitez-vous continuer ?</p>

  <div class="actions-row">
    <button type="button" class="btn-annuler" (click)="annuler()">Annuler</button>
    <button type="button" class="btn-supprimer" (click)="confirmer()">Supprimer définitivement</button>
  </div>

</div>
