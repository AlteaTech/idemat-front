<div class="page-container">

  <div class="page-title">
    <button class="btn-retour" (click)="retour()">
      <img src="Gauche.svg" alt="" class="btn-retour-img" />
    </button>
    <div>
      <h1>Modifier le mot de passe</h1>
      <p class="page-titre-sous">{{ usager()?.prenom }} {{ usager()?.nom }}</p>
    </div>
  </div>

  <form class="contenu" [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="bloc">
      <div class="bloc-header">
        <mat-icon class="bloc-icon">lock_outline</mat-icon>
        <span class="bloc-titre">Mot de passe</span>
      </div>

      <label class="field-label">Mot de passe actuel</label>
      <mat-form-field appearance="outline" class="full-width">
        <input matInput formControlName="ancienMotDePasse" [type]="afficherAncien() ? 'text' : 'password'" placeholder="Mot de passe"/>
        <button mat-icon-button matSuffix type="button" tabindex="-1"
                [attr.aria-label]="afficherAncien() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                (click)="afficherAncien.set(!afficherAncien())">
          <mat-icon>{{ afficherAncien() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error>Champ requis</mat-error>
      </mat-form-field>

      <label class="field-label">Nouveau mot de passe</label>
      <mat-form-field appearance="outline" class="full-width">
        <input matInput formControlName="nouveauMotDePasse" [type]="afficherNouveau() ? 'text' : 'password'" placeholder="Mot de passe"/>
        <button mat-icon-button matSuffix type="button" tabindex="-1"
                [attr.aria-label]="afficherNouveau() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                (click)="afficherNouveau.set(!afficherNouveau())">
          <mat-icon>{{ afficherNouveau() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error>8 caractères minimum</mat-error>
      </mat-form-field>

      <label class="field-label">Confirmer le mot de passe</label>
      <mat-form-field appearance="outline" class="full-width">
        <input matInput formControlName="confirmation" [type]="afficherConfirmation() ? 'text' : 'password'" placeholder="Mot de passe"/>
        <button mat-icon-button matSuffix type="button" tabindex="-1"
                [attr.aria-label]="afficherConfirmation() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                (click)="afficherConfirmation.set(!afficherConfirmation())">
          <mat-icon>{{ afficherConfirmation() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        @if (form.hasError('passwordsMismatch')) {
          <mat-error>Les mots de passe ne correspondent pas</mat-error>
        }
      </mat-form-field>
    </div>

    @if (erreur()) {
      <p class="erreur-msg">{{ erreur() }}</p>
    }

    <button type="submit" class="btn-valider" [disabled]="form.invalid || enCours()">
      @if (enCours()) {
        <mat-spinner diameter="20" color="accent"></mat-spinner>
      } @else {
        <mat-icon>check_circle_outline</mat-icon>
        <span>Enregistrer le nouveau mot de passe</span>
      }
    </button>

  </form>
</div>
